services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      dockerfile: src/SwiftReview.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      UseMockData: "false"
      BootstrapDatabase: "true"
      ConnectionStrings__SwiftReview: "${DOCKER_CONNECTION_STRING:?Set DOCKER_CONNECTION_STRING in .env}"
      InternalApiKey: "${InternalApiKey:?Set InternalApiKey in .env}"
    ports:
      - "5080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: src/SwiftReview.Worker/Dockerfile
    environment:
      ConnectionStrings__SwiftReview: "${DOCKER_CONNECTION_STRING:?Set DOCKER_CONNECTION_STRING in .env}"
      ApiBaseUrl: http://api:8080
      InternalApiKey: "${InternalApiKey:?Set InternalApiKey in .env}"
    depends_on:
      api:
        condition: service_started

volumes:
  sqlserver-data:
