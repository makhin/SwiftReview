services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SwiftReview_Strong_Passw0rd!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'SwiftReview_Strong_Passw0rd!' -C -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      dockerfile: src/SwiftReview.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      UseMockData: "false"
      BootstrapDatabase: "true"
      ConnectionStrings__SwiftReview: "Server=sqlserver,1433;Database=SwiftReview;User Id=sa;Password=SwiftReview_Strong_Passw0rd!;TrustServerCertificate=True;Encrypt=True"
      InternalApiKey: development-internal-key
    ports:
      - "5080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: src/SwiftReview.Worker/Dockerfile
    environment:
      ConnectionStrings__SwiftReview: "Server=sqlserver,1433;Database=SwiftReview;User Id=sa;Password=SwiftReview_Strong_Passw0rd!;TrustServerCertificate=True;Encrypt=True"
      ApiBaseUrl: http://api:8080
      InternalApiKey: development-internal-key
    depends_on:
      api:
        condition: service_started

volumes:
  sqlserver-data:
